<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Terrain Vanabas Booking System</title>
 <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #2d5016 0%, #4a7c2b 100%);
        min-height: 100vh;
        padding: clamp(10px, 5vw, 20px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    
    .login-container {
        background: white;
        padding: clamp(25px, 8vw, 40px);
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 420px;
        animation: slideUp 0.5s ease;
    }
    
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .logo { 
        text-align: center; 
        margin-bottom: clamp(20px, 6vw, 35px); 
    }
    .logo-icon { 
        font-size: clamp(40px, 12vw, 48px); 
        margin-bottom: clamp(8px, 2vw, 10px); 
    }
    .logo h1 { 
        color: #2d5016; 
        font-size: clamp(22px, 6vw, 28px); 
        margin-bottom: clamp(5px, 1.5vw, 8px); 
        font-weight: 700; 
    }
    .logo p { 
        color: #666; 
        font-size: clamp(12px, 3.5vw, 14px); 
    }
    
    .form-group { 
        margin-bottom: clamp(16px, 5vw, 22px); 
    }
    .form-group label { 
        display: block; 
        margin-bottom: 8px; 
        color: #333; 
        font-weight: 600; 
        font-size: clamp(13px, 3.5vw, 14px); 
    }
    
    .input-wrapper { position: relative; }
    .input-icon { 
        position: absolute; 
        left: clamp(12px, 3vw, 15px); 
        top: 50%; 
        transform: translateY(-50%); 
        color: #666; 
        font-size: clamp(16px, 4vw, 18px); 
    }
    
    .form-group input {
        width: 100%;
        padding: clamp(12px, 3.5vw, 14px) clamp(12px, 3vw, 15px) clamp(12px, 3.5vw, 14px) clamp(45px, 10vw, 50px);
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: clamp(14px, 4vw, 15px);
        transition: all 0.3s;
        background: #fafafa;
        min-height: 48px;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #2d5016;
        background: white;
        box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
    }
    
    .remember-me {
        display: flex;
        align-items: center;
        margin-bottom: clamp(15px, 4vw, 20px);
        font-size: clamp(13px, 3.5vw, 14px);
        gap: 8px;
    }
    
    .remember-me input {
        width: clamp(16px, 4vw, 18px);
        height: clamp(16px, 4vw, 18px);
        cursor: pointer;
        flex-shrink: 0;
    }
    
    .btn {
        width: 100%;
        padding: clamp(14px, 4vw, 15px);
        background: #2d5016;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: clamp(15px, 4vw, 16px);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: clamp(8px, 2vw, 10px);
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .btn:hover { 
        background: #4a7c2b; 
        transform: translateY(-2px); 
        box-shadow: 0 5px 15px rgba(45, 80, 22, 0.3); 
    }
    .btn:active { transform: translateY(0); }
    .btn:disabled { 
        background: #ccc; 
        cursor: not-allowed; 
        transform: none; 
    }
    
    .alert {
        padding: clamp(12px, 3vw, 14px) clamp(14px, 3.5vw, 16px);
        border-radius: 10px;
        margin-bottom: clamp(15px, 4vw, 20px);
        display: none;
        font-size: clamp(13px, 3.5vw, 14px);
        animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .alert-error { background: #fee; color: #c33; border: 1px solid #fcc; }
    .alert-success { background: #efe; color: #2d5016; border: 1px solid #cfc; }
    
    .loading-spinner {
        display: inline-block;
        width: clamp(14px, 3.5vw, 16px);
        height: clamp(14px, 3.5vw, 16px);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .footer-text { 
        text-align: center; 
        margin-top: clamp(18px, 5vw, 25px); 
        color: #666; 
        font-size: clamp(12px, 3vw, 13px); 
    }
    
    .session-info {
        text-align: center;
        margin-top: clamp(12px, 3vw, 15px);
        padding: clamp(8px, 2vw, 10px);
        background: #e8f5e9;
        border-radius: 5px;
        font-size: clamp(11px, 3vw, 12px);
        color: #2d5016;
    }
    
    .version { 
        text-align: center; 
        margin-top: clamp(12px, 3vw, 15px); 
        color: #999; 
        font-size: clamp(11px, 3vw, 12px); 
    }
    
    /* Mobile-First Responsive Design */
    @media (max-width: 480px) {
        body {
            padding: clamp(8px, 4vw, 15px);
        }
        
        .login-container {
            padding: clamp(20px, 8vw, 30px);
            margin: 10px;
        }
        
        .input-wrapper {
            margin-bottom: 4px;
        }
        
        .remember-me {
            flex-direction: row;
            gap: clamp(6px, 2vw, 8px);
        }
    }
    
    @media (max-width: 360px) {
        .login-container {
            padding: clamp(18px, 7vw, 25px);
            border-radius: 12px;
        }
        
        .logo {
            margin-bottom: clamp(15px, 5vw, 25px);
        }
    }
</style>

</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">🌳</div>
      <h1>Terrain Vanabas</h1>
      <p>Booking Management System</p>
    </div>
    <div id="alertBox" class="alert"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">📧</span>
          <input type="email" id="email" required placeholder="Enter your email" autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
        </div>
      </div>
      <div class="remember-me">
        <input type="checkbox" id="rememberMe" checked>
        <label for="rememberMe" style="margin: 0; font-weight: normal; cursor: pointer;">Keep me logged in</label>
      </div>
      <button type="submit" id="loginBtn" class="btn">Login to Dashboard</button>
    </form>
    <div class="session-info">
      ℹ️ You will stay logged in until you click Logout
    </div>
    <div class="footer-text">Default: admin@terrainvanabas.com / admin123</div>
    <div class="version">Version 2.0 | Persistent Session</div>
  </div>

  <script>
    // ⚠️ REPLACE WITH YOUR NEW DEPLOYMENT URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbyCVJLsdm6DuZkmHW60QsJ1fih5iDPaRX8Ywk2c4ra2R4F6z-RGDU0uEs7-04TA5bi0/exec';
    
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('alertBox');
    
    window.addEventListener('DOMContentLoaded', function() {
      const userEmail = localStorage.getItem('tvb_userEmail');
      const sessionId = localStorage.getItem('tvb_sessionId');
      const isLoggedIn = localStorage.getItem('tvb_isLoggedIn');
      
      if (userEmail && sessionId && isLoggedIn === 'true') {
        window.location.href = 'dashboard.html';
      }
    });
    
    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      if (!email || !password) {
        showAlert('Please enter both email and password', 'error');
        return;
      }
      
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="loading-spinner"></span> Logging in...';
      
      try {
        // FIXED: Removed Content-Type header to avoid CORS preflight
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'login',
            email: email,
            password: password
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          localStorage.setItem('tvb_userEmail', result.user.email);
          localStorage.setItem('tvb_sessionId', result.user.sessionId);
          localStorage.setItem('tvb_loginTime', result.user.loginTime);
          localStorage.setItem('tvb_isLoggedIn', 'true');
          localStorage.setItem('tvb_rememberMe', rememberMe ? 'true' : 'false');
          
          showAlert('✓ Login successful! Redirecting...', 'success');
          
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          showAlert('✗ ' + (result.error || 'Invalid credentials'), 'error');
          loginBtn.disabled = false;
          loginBtn.innerHTML = 'Login to Dashboard';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (error) {
        console.error('Login error:', error);
        showAlert('✗ Connection error. Please re-deploy your Web App and update the API_URL.', 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Login to Dashboard';
      }
    });
    
    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'alert alert-' + type;
      alertBox.style.display = 'block';
      if (type === 'success') {
        setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
      }
    }
    
    emailInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
